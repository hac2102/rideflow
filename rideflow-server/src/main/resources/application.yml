server:
  port: 8080

spring:
  application:
    name: rideflow-server
  datasource:
    url: jdbc:h2:mem:rideflow_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: RideFlowHikariPool
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

rideflow:
  simulation:
    tick-interval-ms: 1000
    auto-start: false
    default-seed: 42
  dispatch:
    pickup-radius-km: 10.0
    strategy: WEIGHTED_FAIR # WEIGHTED_FAIR or NEAREST

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/rideflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: rideflow_user
    password: rideflow_password
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      pool-name: RideFlowMySQLHikariPool
