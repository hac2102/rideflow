version: '3.8'

services:
  rideflow-mysql:
    image: mysql:8.4
    container_name: rideflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: rideflow_db
      MYSQL_USER: rideflow_user
      MYSQL_PASSWORD: rideflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  rideflow-adminer:
    image: adminer:latest
    container_name: rideflow-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - rideflow-mysql

volumes:
  mysql_data:
